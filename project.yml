name: ZOBOPPhoneCare
options:
  bundleIdPrefix: com.zobop
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  ZOBOPPhoneCare:
    type: application
    platform: iOS
    sources:
      - path: ZOBOPPhoneCare
        excludes:
          - Tests
          - Widget
          - README_V1_DELIVERY.md
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zobop.phonecare
        PRODUCT_NAME: ZOBOP Phone Care
        INFOPLIST_KEY_CFBundleDisplayName: ZOBOP Phone Care
        CODE_SIGN_ENTITLEMENTS: ZOBOPPhoneCare/App/ZOBOPPhoneCare.entitlements
    entitlements:
      path: ZOBOPPhoneCare/App/ZOBOPPhoneCare.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.zobop.phonecare
  ZOBOPPhoneCareTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - ZOBOPPhoneCare/Tests
    dependencies:
      - target: ZOBOPPhoneCare
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zobop.phonecare.tests
  ZOBOPCareWidget:
    type: app-extension
    platform: iOS
    sources:
      - ZOBOPPhoneCare/Widget
      - ZOBOPPhoneCare/Models/WidgetCareSnapshot.swift
      - ZOBOPPhoneCare/Services/WidgetSnapshotStore.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zobop.phonecare.widget
        PRODUCT_NAME: ZOBOP Care
        INFOPLIST_FILE: ZOBOPPhoneCare/Widget/Info.plist
        CODE_SIGN_ENTITLEMENTS: ZOBOPPhoneCare/Widget/ZOBOPCareWidget.entitlements
    entitlements:
      path: ZOBOPPhoneCare/Widget/ZOBOPCareWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.zobop.phonecare
    dependencies:
      - target: ZOBOPPhoneCare
        embed: true
schemes:
  ZOBOPPhoneCare:
    build:
      targets:
        ZOBOPPhoneCare: all
        ZOBOPCareWidget: all
    test:
      targets:
        - ZOBOPPhoneCareTests
