name: ZOBOPPhoneCare
options:
  bundleIdPrefix: com.zobop
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.0
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  ZOBOPPhoneCare:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Models
      - path: Services
      - path: Views
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zobop.phonecare
        CODE_SIGN_ENTITLEMENTS: App/ZOBOPPhoneCare.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: ZOBOP Phone Care
    entitlements:
      path: App/ZOBOPPhoneCare.entitlements
  ZOBOPPhoneCareTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: ZOBOPPhoneCare
  ZOBOPCareWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      - path: Models/WidgetCareSnapshot.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zobop.phonecare.widget
        CODE_SIGN_ENTITLEMENTS: Widget/ZOBOPCareWidget.entitlements
    entitlements:
      path: Widget/ZOBOPCareWidget.entitlements
    dependencies:
      - target: ZOBOPPhoneCare
schemes:
  ZOBOPPhoneCare:
    build:
      targets:
        ZOBOPPhoneCare: all
        ZOBOPCareWidget: all
    test:
      targets:
        - ZOBOPPhoneCareTests
